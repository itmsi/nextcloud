; Custom PHP settings untuk mendukung upload file besar di Nextcloud.
; Sesuaikan nilainya (default di bawah cocok untuk kebutuhan file s/d ~4-10G,
; asalkan reverse proxy di depan juga mengizinkan body size yang sama/lebih besar).

memory_limit = 1024M
upload_max_filesize = 10G
post_max_size = 10G
max_execution_time = 3600
max_input_time = 3600
