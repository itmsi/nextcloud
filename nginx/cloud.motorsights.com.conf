# Sample vhost untuk reverse proxy NGINX GLOBAL yang sudah berjalan di server
# (di luar stack docker-compose ini). Sesuaikan path SSL cert dengan setup
# Let's Encrypt yang dipakai reverse proxy global tsb (certbot / acme.sh / dll).
#
# Taruh file ini di folder vhost/conf.d milik reverse proxy global,
# lalu reload nginx-nya (nginx -s reload / docker exec ... nginx -s reload).
#
# "app" pada proxy_pass adalah nama service Nextcloud di docker-compose.yml
# stack ini (nextcloud_app), yang sudah tergabung ke network eksternal
# "proxy" yang sama dengan reverse proxy global ini (lihat PROXY_NETWORK_NAME
# di .env). Jika reverse proxy global berjalan sebagai container terpisah,
# ganti "app" dengan nama container "nextcloud_app" atau IP-nya.

server {
    listen 80;
    server_name cloud.motorsights.com;

    # Untuk validasi Let's Encrypt (HTTP-01 challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cloud.motorsights.com;

    ssl_certificate     /etc/letsencrypt/live/cloud.motorsights.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.motorsights.com/privkey.pem;

    # Nextcloud butuh body size besar untuk upload file
    client_max_body_size 10G;
    client_body_timeout 3600s;
    fastcgi_buffers 64 4K;

    # Header keamanan yang direkomendasikan Nextcloud
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_redirect off;
    }
}

# Catatan jika reverse proxy global memakai jwilder/nginx-proxy + acme-companion
# (VIRTUAL_HOST env var), file ini tidak dipakai. Sebagai gantinya, tambahkan
# environment berikut ke service "app" di docker-compose.yml:
#
#   VIRTUAL_HOST: cloud.motorsights.com
#   VIRTUAL_PORT: 80
#   LETSENCRYPT_HOST: cloud.motorsights.com
#   LETSENCRYPT_EMAIL: admin@motorsights.com
#
# dan nginx-proxy/acme-companion akan mengurus vhost + SSL secara otomatis,
# file konfigurasi manual ini tidak diperlukan lagi.
