# Vhost untuk reverse proxy NGINX NATIVE (host, /etc/nginx/sites-available)
# yang sudah berjalan di server ini.
#
# Cara pakai:
#   sudo cp nginx/cloud.motorsights.com.conf \
#       /etc/nginx/sites-available/cloud.motorsights.com
#   sudo ln -s /etc/nginx/sites-available/cloud.motorsights.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d cloud.motorsights.com
#
# Sengaja TIDAK ada blok `listen 443 ssl` / `ssl_certificate` di sini.
# `certbot --nginx` akan otomatis menyisipkan blok SSL + path sertifikat
# (`/etc/letsencrypt/live/cloud.motorsights.com/fullchain.pem` & privkey.pem)
# ke server block ini, plus redirect HTTP->HTTPS, lalu reload nginx sendiri.
# Semua directive proxy/header/body-size di bawah akan ikut terbawa ke blok
# 443 hasil edit certbot, karena certbot menyalin server block yang ada.
#
# Karena nginx ini berjalan di HOST (bukan container), ia TIDAK bisa resolve
# nama service Docker "app" lewat DNS Docker. Oleh karena itu service "app"
# di docker-compose.yml sudah di-publish ke 127.0.0.1:8080 (lihat "ports:"
# pada service app). Kalau nanti reverse proxy dipindah jadi container yang
# join ke network eksternal "proxy" yang sama, ganti proxy_pass jadi
# http://app:80 dan baris "ports:" di compose bisa dihapus.

server {
    listen 80;
    server_name cloud.motorsights.com;

    # Nextcloud butuh body size besar untuk upload file
    client_max_body_size 10G;
    client_body_timeout 3600s;
    fastcgi_buffers 64 4K;

    # Header keamanan yang direkomendasikan Nextcloud
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_redirect off;
    }
}

# Catatan jika reverse proxy global memakai jwilder/nginx-proxy + acme-companion
# (VIRTUAL_HOST env var) alih-alih nginx native di atas, file ini tidak
# dipakai. Sebagai gantinya, tambahkan environment berikut ke service "app"
# di docker-compose.yml:
#
#   VIRTUAL_HOST: cloud.motorsights.com
#   VIRTUAL_PORT: 80
#   LETSENCRYPT_HOST: cloud.motorsights.com
#   LETSENCRYPT_EMAIL: admin@motorsights.com
#
# dan nginx-proxy/acme-companion akan mengurus vhost + SSL secara otomatis.
